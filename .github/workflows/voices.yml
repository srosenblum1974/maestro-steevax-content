name: Fetch voices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/voix.json", "tools/fetch_voices.py"]

permissions:
  contents: write

concurrency:
  group: resolve-media
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the narrations and link them to their works
        run: python3 tools/fetch_voices.py
      - name: Rebuild index and manifest
        run: python3 tools/build.py
      - name: Commit
        run: |
          git config user.name "Steve Rosenblum"
          git config user.email "s.rosenblum@me.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Voix : récits racontés"
          git push
