<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maestro Steevax</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="description" content="Un entrepreneur découvre la musique classique, semaine après semaine. Faites le chemin avec lui, à votre rythme.">
<meta property="og:title" content="Maestro Steevax">
<meta property="og:description" content="Apprendre à écouter la musique classique, une semaine à la fois.">
<meta property="og:image" content="https://maestrosteevax.com/illus/accueil.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141110; --paper:#f6f1e7; --card:#fffdf8; --line:#e4dccb; --muted:#6f655a;
  --accent:#8c2232; --accent-soft:#f1e3e1; --gold:#c49a4a;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:Inter,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}

/* Top bar floating over the paintings */
.top{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding:calc(14px + env(safe-area-inset-top)) 20px 14px;background:linear-gradient(rgba(10,8,7,.55),transparent);pointer-events:none}
.top>*{pointer-events:auto}
.brand{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.03em;text-decoration:none;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.brand i{color:var(--gold);font-weight:500}
.lang button{border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer}
.lang button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* Full-bleed painting with text over it */
.bleed{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.bleed img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.02)}
.bleed::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,8,7,.15) 0%,rgba(10,8,7,.05) 35%,rgba(10,8,7,.82) 78%,rgba(10,8,7,.96) 100%)}
.bleed .inner{width:100%;max-width:860px;margin:0 auto;padding:0 22px calc(36px + env(safe-area-inset-bottom))}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);font-weight:600}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(46px,11vw,96px);line-height:.95;margin:10px 0 14px;text-shadow:0 2px 24px rgba(0,0,0,.4)}
h2{font-family:var(--serif);font-weight:500;font-size:clamp(34px,8vw,60px);line-height:1;margin:8px 0 10px}
.lede{font-size:18px;max-width:34ch;color:rgba(246,241,231,.86)}
.credit{position:absolute;right:12px;bottom:10px;font-size:10px;color:rgba(246,241,231,.55);max-width:60%;text-align:right;z-index:1}
.credit a{text-decoration:none}
.progress{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:14px;color:rgba(246,241,231,.8)}
.bar{flex:1;max-width:340px;height:4px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .5s}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:22px;background:var(--paper);color:var(--ink);border:0;border-radius:99px;padding:13px 22px;font-weight:600;cursor:pointer;text-decoration:none}

/* Tabs */
.top.solid{background:rgba(20,17,16,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
nav.tabs{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:15;display:flex;justify-content:center;gap:4px;padding:12px 10px;background:rgba(20,17,16,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
nav.tabs button{white-space:nowrap;border:0;background:none;padding:8px 11px;border-radius:99px;font-size:14px;font-weight:500;color:rgba(246,241,231,.6);cursor:pointer}
nav.tabs button.on{background:rgba(196,154,74,.18);color:var(--gold)}
section.view{display:none}
section.view.on{display:block}

/* Week tiles: one full-bleed painting each */
.tile{position:relative;display:flex;align-items:flex-end;min-height:72svh;text-decoration:none;overflow:hidden;isolation:isolate;border-bottom:1px solid rgba(0,0,0,.6)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.2s ease}
.tile:hover img{transform:scale(1.04)}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 30%,rgba(10,8,7,.9) 100%)}
.tile .inner{width:100%;max-width:860px;margin:0 auto;padding:0 22px 30px;display:flex;align-items:flex-end;gap:18px}
.num{flex:none;font-family:var(--serif);font-size:64px;line-height:.8;font-weight:700;color:var(--gold);opacity:.95}
.tile.done .num::after{content:" ✓";font-size:28px;color:var(--paper)}
.tile .t b{display:block;font-family:var(--serif);font-size:clamp(28px,6vw,44px);font-weight:500;line-height:1.05}
.tile .t small{font-size:13px;color:rgba(246,241,231,.75)}
.tile.current .t small::before{content:"● ";color:var(--gold)}

/* Week detail: content on paper below the painting */
.paper{background:var(--paper);color:var(--ink)}
.paper .wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px}
.work{padding:26px 0;border-bottom:1px solid var(--line)}
.work:last-of-type{border-bottom:0}
.work h3{font-family:var(--serif);font-size:32px;font-weight:700;margin:0;line-height:1.1}
.meta{color:var(--muted);font-size:14px;margin:4px 0 16px}
.field{margin:12px 0;font-size:16px}
.field em{display:block;font-style:normal;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.track{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);border-radius:16px;padding:12px 16px 12px 12px;margin:10px 0}
.play{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--gold);color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center}
.track .tt{flex:1;min-width:0}
.track .tt b{display:block;font-weight:600;font-size:15px}
.track .tt small{display:block;font-size:12px;color:rgba(246,241,231,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .scrub{height:3px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:8px;overflow:hidden;cursor:pointer}
.track .scrub i{display:block;height:100%;width:0;background:var(--gold)}
.ref{font-size:14px;color:var(--muted);margin-top:14px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.links a{font-size:13px;text-decoration:none;border:1px solid var(--line);padding:5px 12px;border-radius:99px;background:var(--card)}
.listens label{display:flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;user-select:none;background:var(--card)}
.listens input{accent-color:var(--accent)}
.listens label.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.stars{display:flex;gap:2px;margin:6px 0}
.stars button{border:0;background:none;font-size:24px;cursor:pointer;color:var(--line);padding:0 2px}
.stars button.on{color:var(--gold)}
textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:12px;padding:12px;font:15px var(--sans);background:var(--card);resize:vertical;color:var(--ink)}
.review{margin:24px 0 0;padding:16px 18px;background:var(--accent-soft);border-radius:14px;font-size:16px}
.back{display:inline-block;margin-bottom:8px;font-size:14px;color:var(--accent);text-decoration:none;font-weight:600}
.next{display:block;margin-top:30px;text-align:center}

/* Notebook & method */
.ritual{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.ritual div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.ritual b{display:block;font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:4px}
.ritual span{font-size:14px;color:var(--muted)}
.entry{border-left:3px solid var(--gold);padding:4px 0 4px 16px;margin:16px 0}
.entry small{color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tools button,.tools label{border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer}
.paper h2{color:var(--ink)}
/* Guided work */
.hook{font-family:var(--serif);font-size:25px;line-height:1.2;font-style:italic;margin:6px 0 16px}
.story{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.story p{margin:6px 0 14px}.story p:last-child{margin-bottom:0}
.lab{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.world{font-size:15px;color:var(--muted);border-left:3px solid var(--gold);padding-left:12px;margin:0 0 6px}
details.gl{margin-top:6px;font-size:14px}details.gl summary{cursor:pointer;display:inline-block;border-bottom:1px dotted var(--muted);margin-right:12px}
.weekbar{display:flex;align-items:center;gap:12px;margin:14px 0 22px;font-size:14px;color:rgba(246,241,231,.85)}
.stepper{display:flex;margin:22px 0 10px;position:relative}
.stepper button{flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);position:relative;padding:0}
.stepper button:disabled{cursor:default;opacity:.55}
.stepper i{font-style:normal;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);font-size:15px;z-index:1}
.stepper button:not(:first-child)::before{content:"";position:absolute;top:18px;right:50%;width:100%;height:2px;background:var(--line)}
.stepper .done i{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.stepper .done:not(:first-child)::before,.stepper .cur:not(:first-child)::before{background:var(--gold)}
.stepper .open{color:var(--accent)}.stepper .open i{border-color:var(--accent)}
.step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:8px 0}
.step h4{font-family:var(--serif);font-size:25px;margin:0 0 4px;line-height:1.1}
.step .ask{font-weight:600;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip b{font-size:20px;font-weight:400;line-height:1}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.good{background:#e5f1dd;border-color:#4d7c35;color:#33591f}.chip.bad{background:#f8e2de;border-color:#b3412e;color:#8a2f20}.chip.miss{border-style:dashed;border-color:#4d7c35;color:#33591f}
.moment{display:flex;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 0;cursor:pointer;color:inherit}
.moment u{text-decoration:none;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff}
.moment.on u{background:var(--gold);border-color:var(--gold)}
.moment small{display:block;font-weight:600;color:var(--accent)}
.quizq{margin:14px 0}.quizq p{font-weight:600;margin:0 0 8px}
.feedback{font-size:14px;margin:8px 0 0}
.go{display:block;width:100%;margin-top:20px;border:0;border-radius:14px;padding:15px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.go:disabled{background:var(--line);color:var(--muted);cursor:default}
.ghost{border:1px solid var(--line);background:none;border-radius:12px;padding:9px 13px;font-size:14px;cursor:pointer;margin-top:8px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 0}
.souv{background:var(--ink);color:var(--paper);border-radius:18px;padding:20px;margin:8px 0}
.souv h4{font-family:var(--serif);font-size:25px;margin:0 0 2px;color:var(--gold)}
.souv .row{font-size:22px;margin:10px 0 2px}.souv q{display:block;font-family:var(--serif);font-size:20px;font-style:italic;margin-top:10px;quotes:none}
.souv .ghost{color:var(--paper);border-color:rgba(255,255,255,.3)}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;transition:.3s;background:#2f5a1f;color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;font-size:14px;z-index:50;pointer-events:none;white-space:nowrap}
#toast.on{transform:translate(-50%,0);opacity:1}
.tilebar{display:block;width:140px;height:3px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:8px;overflow:hidden}.tilebar i{display:block;height:100%;background:var(--gold)}
/* History */
.frise{display:flex;gap:3px;margin:18px 0}.frise a{flex:1;min-width:0;background:var(--ink);color:var(--paper);text-decoration:none;font-size:12px;padding:12px 6px;text-align:center;border-radius:6px}
.frise a b{display:block;font-family:var(--serif);font-size:15px;overflow:hidden;text-overflow:ellipsis}
.era{min-height:64svh}
.era-body{max-width:760px;margin:0 auto;padding:24px 20px 34px}
.era-body p{margin:6px 0 16px}
.weeklinks{display:flex;flex-wrap:wrap;gap:8px}.weeklinks a{font-size:13px;text-decoration:none;background:var(--accent-soft);color:var(--accent);padding:6px 12px;border-radius:99px;font-weight:600}
.memo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
footer{padding:28px 20px calc(40px + env(safe-area-inset-bottom));text-align:center;color:rgba(246,241,231,.5);font-size:12px}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#">Maestro <i>Steevax</i></a>
  <div class="lang"><button data-l="fr">FR</button> <button data-l="en">EN</button></div>
</header>

<main id="home">
  <section class="bleed" id="hero">
    <img class="bg" id="heroImg" alt="">
    <div class="inner">
      <div class="kicker" data-t="heroKicker"></div>
      <h1 data-t="heroTitle"></h1>
      <p class="lede" id="tagline"></p>
      <div class="progress"><div class="bar"><i id="bar"></i></div><span id="progressText"></span></div>
      <a class="cta" id="cta" href="#"></a>
    </div>
    <div class="credit" id="heroCredit"></div>
  </section>

  <nav class="tabs">
    <button data-tab="parcours" class="on" data-t="tabPath"></button>
    <button data-tab="histoire" data-t="tabHistory"></button>
    <button data-tab="journal" data-t="tabJournal"></button>
    <button data-tab="methode" data-t="tabMethod"></button>
  </nav>

  <section class="view on" id="parcours"><div id="tiles"></div></section>

  <section class="view paper" id="histoire"><div id="historyBody"></div></section>

  <section class="view paper" id="journal"><div class="wrap">
    <div class="kicker" data-t="mineKicker"></div>
    <h2 data-t="mineTitle"></h2>
    <div id="mine"></div>
    <div class="kicker" style="margin-top:34px" data-t="journalKicker"></div>
    <h2 data-t="journalTitle"></h2>
    <p data-t="journalIntro"></p>
    <div id="entries"></div>
  </div></section>

  <section class="view paper" id="methode"><div class="wrap">
    <div class="kicker" data-t="methodKicker"></div>
    <h2 data-t="methodTitle"></h2>
    <div class="ritual" id="ritual"></div>
    <p id="notebook"></p>
    <p id="signal"></p>
    <h2 data-t="phasesTitle"></h2>
    <div id="phases"></div>
    <h2 data-t="saveTitle"></h2>
    <p data-t="saveIntro"></p>
    <div class="tools">
      <button id="export" data-t="export"></button>
      <label><input type="file" id="import" accept="application/json" hidden><span data-t="import"></span></label>
    </div>
    <p id="saveMsg" class="empty"></p>
  </div></section>
</main>

<main id="week" hidden></main>

<footer data-t="footer"></footer>
<div id="toast" role="status"></div>

const KEY="maestro.progress.v1", LKEY="maestro.lang";
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get(LKEY,(navigator.language||"fr").startsWith("fr")?"fr":"en");
let progress=store.get(KEY,{});
let parcours,weeks=[],journal={entries:[]};
const t=k=>UI[lang][k], L=o=>o?(o[lang]||o.fr):"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);

function ws(id){const s=progress[id]||(progress[id]={listens:[false,false,false],rating:0,note:""});
  for(const k of ["emotions","images","instruments","moments"])s[k]=s[k]||[];s.quiz=s.quiz||{};return s}
const stepsOf=w=>w.works.reduce((n,x)=>n+(progress[x.id]?progress[x.id].listens.filter(Boolean).length:0),0);
const allSteps=()=>weeks.reduce((n,w)=>n+w.works.length*3,0);
const doneSteps=()=>weeks.reduce((n,w)=>n+stepsOf(w),0);
let toastT;function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),1900)}
const pal=(k,id)=>(parcours.palette[k]||[]).find(x=>x.id===id);
const toggle=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)};
const openStep={};
const stepNow=s=>{const i=s.listens.indexOf(false);return i};
const workDone=id=>{const s=progress[id];return !!s&&s.listens.every(Boolean)};
const weekDone=w=>w.works.every(x=>workDone(x.id));
const current=()=>weeks.find(w=>!weekDone(w))||weeks[weeks.length-1];
function save(){store.set(KEY,progress);renderProgress()}
function credit(img){return img?`<a href="${esc(img.source)}" target="_blank" rel="noopener">${t("painting")} : ${esc(img.credit)} · ${esc(img.license)}</a>`:""}

function renderProgress(){
  const done=weeks.filter(weekDone).length;
  const a=allSteps(),d=doneSteps();
  $("bar").style.width=(a?d/a*100:0)+"%";
  $("progressText").textContent=`${d} / ${a} ${t("steps")} · ${done} / ${weeks.length} ${t("of")}`;
  const c=current();
  if(c){$("cta").href="#"+c.id;$("cta").textContent=(done?`${t("resume")} ${c.n}`:t("begin"))+"  →"}
}

function renderHome(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  $("tagline").textContent=L(parcours.tagline);
  if(parcours.heroImage){$("heroImg").src=parcours.heroImage.path;$("heroImg").style.objectPosition=parcours.heroImage.focus||"50% 40%";$("heroCredit").innerHTML=credit(parcours.heroImage)}
  const c=current();
  $("tiles").innerHTML=weeks.map(w=>`
    <a class="tile ${weekDone(w)?"done":""} ${w===c?"current":""}" href="#${w.id}">
      ${w.image?`<img src="${esc(w.image.path)}" alt="" loading="lazy" style="object-position:${esc(w.image.focus||"50% 40%")}">`:""}
      <div class="inner"><div class="num">${w.n}</div>
        <div class="t"><small>${t("week")} ${w.n} · ${esc(L(parcours.periods[w.period]))}</small><b>${esc(L(w.title))}</b><span class="tilebar"><i style="width:${stepsOf(w)/(w.works.length*3)*100}%"></i></span></div></div>
    </a>`).join("");
  $("ritual").innerHTML=parcours.ritual.map(r=>`<div><b>${esc(L(r.title))}</b><span>${esc(L(r.text))}</span></div>`).join("");
  $("notebook").textContent=L(parcours.notebook);
  $("signal").textContent=L(parcours.signal);
  $("phases").innerHTML=parcours.phases.map(p=>`<div class="entry"><b>Phase ${p.n} · ${esc(L(p.title))}</b><br><small>${t("week")} ${p.weeks}</small></div>`).join("");
  const es=journal.entries.slice().sort((a,b)=>b.date.localeCompare(a.date));
  $("entries").innerHTML=es.length?es.map(e=>`<div class="entry"><small>${esc(e.date)} · ${"★".repeat(e.rating||0)}</small><div>${esc(L(e.note))}</div></div>`).join(""):`<p class="empty">${t("noEntries")}</p>`;
  renderMine();renderHistory();
  renderProgress();

function chipsRO(k,ids){return ids.map(i=>{const p=pal(k,i);return p?p.icon:""}).join(" ")}
function renderMine(){
  const items=[];weeks.forEach(w=>w.works.forEach(x=>{const s=progress[x.id];if(s&&s.listens&&s.listens.some(Boolean))items.push({w,x,s})}));
  $("mine").innerHTML=items.length?items.map(({w,x,s})=>`<a class="memo" style="display:block;text-decoration:none" href="#${w.id}">
    <small>${t("week")} ${w.n} · ${t("stepOf")} ${s.listens.filter(Boolean).length}/3${s.savedAt?" · "+esc(s.savedAt):""}</small>
    <div style="font-family:var(--serif);font-size:23px;font-weight:700">${esc(L(x.title))}</div>

}

    <div class="frise">${h.periods.map(p=>`<a href="#" data-era="${p.id}" ><b>${esc(L(p.title))}</b>${esc(p.dates)}</a>`).join("")}</div>

    ${h.periods.map(p=>`<div id="era-${p.id}"><section class="bleed era"><img class="bg" src="${esc(p.image.path)}" alt="" loading="lazy" style="object-position:${esc(p.image.focus||"50% 40%")}">
      <div class="inner"><div class="kicker">${esc(p.dates)}</div><h2 style="color:var(--paper)">${esc(L(p.title))}</h2><p class="lede" style="max-width:none">${esc(L(p.oneLine))}</p></div><div class="credit">${credit(p.image)}</div></section>
      <div class="era-body"><span class="lab">${t("worldL")}</span><p>${esc(L(p.world))}</p><span class="lab">${t("soundL")}</span><p>${esc(L(p.sound))}</p><span class="lab">${t("who")}</span><p>${p.people.map(esc).join(" · ")}</p>
      <span class="lab">${t("listenW")}</span><div class="weeklinks" style="margin-top:6px">${p.weeks.map(n=>{const w=weeks.find(x=>x.n===n);return w?`<a href="#${w.id}">${t("week")} ${n} · ${esc(L(w.title))}</a>`:""}).join("")}</div></div></div>`).join("")}

// ---- Audio: one player for the whole page
const audio=new Audio(); audio.preload="none";
let playing=null; // {work, idx, el}
function fmt(s){if(!isFinite(s))return"";s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
audio.ontimeupdate=()=>{if(!playing)return;const p=audio.duration?audio.currentTime/audio.duration:0;
  playing.el.querySelector(".scrub i").style.width=(p*100)+"%";playing.el.querySelector(".time").textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration)};
audio.onended=()=>setBtn(false);
audio.onpause=()=>setBtn(false); audio.onplay=()=>setBtn(true);
function setBtn(on){if(playing){const b=playing.el.querySelector(".play");if(b)b.textContent=on?"❚❚":"▶"}}
function bindTrack(el){
  const url=el.dataset.url;
  el.querySelector(".play").onclick=()=>{
    if(playing&&playing.el===el){audio.paused?audio.play():audio.pause();return}
    if(playing)setBtn(false);
    playing={work:el.dataset.work,el};audio.src=url;audio.play().catch(()=>{});
    if("mediaSession" in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:el.dataset.title,artist:el.dataset.composer,album:"Maestro Steevax",
      artwork:el.dataset.art?[{src:el.dataset.art,sizes:"512x512",type:"image/jpeg"}]:[]})}
  };
  el.querySelector(".scrub").onclick=e=>{if(playing&&playing.el===el&&audio.duration){const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration}};
}

function workHTML(x){
  const s=ws(x.id),g=x.guide,r=x.recording,tracks=x.audio||[];
  const now=stepNow(s),all=now<0,open=openStep[x.id]??(all?-1:now);
  const names=[t("s1"),t("s2"),t("s3")];
  const chip=(k,id,arr)=>{const p=pal(k,id);return p?`<button class="chip ${arr.includes(id)?"on":""}" data-k="${k}" data-id="${id}"><b>${p.icon}</b>${esc(L(p.label))}</button>`:""};
  const earDone=!!s.earChecked;
  const step=[
   ()=>`<div class="step"><h4>${t("s1")}</h4><p>${t("m1")}</p>${g?`<span class="lab">${t("howL")}</span><p style="margin-top:4px">${esc(L(g.how))}</p>`:""}
     <p class="ask">${t("feel")}</p><div class="chips">${parcours.palette.emotions.map(e=>chip("emotions",e.id,s.emotions)).join("")}</div>
     <p class="ask">${t("see")}</p><div class="chips">${parcours.palette.images.map(e=>chip("images",e.id,s.images)).join("")}</div>
     <button class="go" data-val="0" ${s.emotions.length?"":"disabled"}>${t("val1")}</button>${s.emotions.length?"":`<p class="hint">${t("h1")}</p>`}</div>`,
   ()=>`<div class="step"><h4>${t("s2")}</h4><p>${t("m2")}</p><span class="lab">${t("listen")}</span><p style="margin-top:4px">${esc(L(x.listenFor))}</p>
     ${g?`<p class="ask">${t("moments")}</p>${g.moments.map((m,i)=>`<button class="moment ${s.moments.includes(i)?"on":""}" data-m="${i}"><u>✓</u><span><small>${esc(L(m.when))}</small>${esc(L(m.what))}</span></button>`).join("")}
     <p class="ask">${t("earQ")}</p><div class="chips" id="ear-${x.id}">${g.ear.options.map(id=>{const p=pal("instruments",id);const on=s.instruments.includes(id),ok=g.ear.answer.includes(id);
        const c=earDone?(on&&ok?"good":on?"bad":ok?"miss":""):(on?"on":"");return `<button class="chip ${c}" data-ear="${id}" ${earDone?"disabled":""}><b>${p.icon}</b>${esc(L(p.label))}</button>`}).join("")}</div>
     ${earDone?`<p class="feedback">${g.ear.answer.every(a=>s.instruments.includes(a))&&s.instruments.every(a=>g.ear.answer.includes(a))?t("earGood"):t("earMid")}</p>`:`<button class="ghost" data-check="1" ${s.instruments.length?"":"disabled"}>${t("check")}</button>`}`:""}
     <button class="go" data-val="1" ${!g||earDone?"":"disabled"}>${t("val2")}</button>${!g||earDone?"":`<p class="hint">${t("h2")}</p>`}</div>`,
   ()=>{const qs=g?g.quiz:[];const okQ=qs.every((q,i)=>s.quiz[i]!==undefined);const ready=okQ&&s.rating>0;return `<div class="step"><h4>${t("s3")}</h4><p>${t("m3")}</p>
     ${qs.length?`<p class="ask">${t("quizT")}</p>`:""}${qs.map((q,i)=>{const a=s.quiz[i];return `<div class="quizq"><p>${esc(L(q.q))}</p><div class="chips">${q.options.map((o,j)=>{const c=a===undefined?"":j===q.answer?"good":j===a?"bad":"";return `<button class="chip ${c}" data-q="${i}" data-o="${j}" ${a!==undefined?"disabled":""}>${esc(L(o))}</button>`}).join("")}</div>${a!==undefined?`<p class="feedback">${esc(L(q.why))}</p>`:""}</div>`}).join("")}
     <p class="ask">${t("rate")}</p><div class="stars">${[1,2,3,4,5].map(n=>`<button data-r="${n}" class="${n<=s.rating?"on":""}" aria-label="${n}">★</button>`).join("")}</div><p class="hint" style="text-align:left" id="rl-${x.id}">${s.rating?esc(L(parcours.palette.ratings[s.rating-1])):""}</p>
     <p class="ask">${t("sentence")}</p><div class="chips" style="margin-bottom:8px">${parcours.palette.starters.map(o=>`<button class="chip" data-st="${esc(L(o))}">${esc(L(o))}</button>`).join("")}</div>
     <textarea placeholder="${esc(t("notePh"))}">${esc(s.note)}</textarea><p class="hint" style="text-align:right;min-height:18px" data-saved></p>
     <button class="go" data-val="2" ${ready?"":"disabled"}>${t("val3")}</button>${ready?"":`<p class="hint">${t("h3")}</p>`}</div>`}
  ];
  return `<div class="work" data-work="${x.id}">
    <h3>${esc(L(x.title))}</h3><div class="meta">${esc(x.composer)} · ${esc(x.year)}</div>
    ${g?`<p class="hook">${esc(L(g.hook))}</p><div class="story"><span class="lab">${t("context")}</span><p>${esc(L(g.context))}</p><span class="lab">${t("why")}</span><p>${esc(L(g.why))}</p>
      <span class="lab">${t("words")}</span>${g.glossary.map(k=>`<details class="gl"><summary>${esc(L(k.term))}</summary> ${esc(L(k.def))}</details>`).join("")}</div>`:""}
    <div class="field"><em>${t("piece")} · ${t("start")}</em>${esc(L(x.startWith))}</div>
    ${tracks.length?tracks.map(a=>`<div class="track" data-url="${esc(a.url)}" data-work="${x.id}" data-title="${esc(L(x.title))} — ${esc(L(a.label))}" data-composer="${esc(x.composer)}" data-art="">
       <button class="play" aria-label="Play">▶</button><div class="tt"><b>${esc(L(a.label))}</b><small>${esc(a.performer)} · ${esc(a.license)} · <span class="time"></span></small><div class="scrub"><i></i></div></div></div>`).join(""):`<p class="ref">${t("noAudio")}</p><div class="links"><a href="${x.links.youtube}" target="_blank" rel="noopener">YouTube</a><a href="${x.links.appleMusic}" target="_blank" rel="noopener">Apple Music</a><a href="${x.links.spotify}" target="_blank" rel="noopener">Spotify</a></div>`}
    <div class="stepper">${names.map((n,i)=>{const d=s.listens[i],can=d||i===now;return `<button class="${d?"done":""} ${i===open?"open":""} ${i===now?"cur":""}" data-go="${i}" ${can?"":"disabled title=\""+t("locked")+"\""}><i>${d?"✓":can?i+1:"🔒"}</i>${n}</button>`}).join("")}</div>
    ${open>=0?step[open]():""}
    ${all&&open<0?`<div class="souv"><h4>${t("souv")}</h4><small>${esc(s.savedAt||"")}</small><div class="row">${chipsRO("emotions",s.emotions)} ${chipsRO("images",s.images)}</div><div style="color:var(--gold);font-size:20px">${"★".repeat(s.rating)}</div>${s.rating?`<small>${esc(L(parcours.palette.ratings[s.rating-1]))}</small>`:""}${s.note?`<q>${esc(s.note)}</q>`:""}<div><button class="ghost" data-go="2">${t("edit")}</button></div></div>`:""}
    <p class="ref"><b>${t("reference")}</b> : ${esc(r.performers)} (${esc(r.label)}${r.year?", "+r.year:""})</p>
    ${tracks.length?`<div class="links"><a href="${x.links.appleMusic}" target="_blank" rel="noopener">Apple Music</a><a href="${x.links.spotify}" target="_blank" rel="noopener">Spotify</a><a href="${x.links.youtube}" target="_blank" rel="noopener">YouTube</a></div>`:""}
  </div>`;
}
function bindWork(el){
  const id=el.dataset.work,s=ws(id);
  const again=(scroll)=>{save();renderWeek(location.hash.slice(1),true);if(scroll){const n=document.querySelector(`[data-work="${id}"] .stepper`);if(n)n.scrollIntoView({behavior:"smooth",block:"start"})}};
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const i=+b.dataset.go;openStep[id]=openStep[id]===i?-1:i;renderWeek(location.hash.slice(1),true)});
  el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{toggle(s[b.dataset.k],b.dataset.id);again()});
  el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{toggle(s.moments,+b.dataset.m);again()});
  el.querySelectorAll("[data-ear]").forEach(b=>b.onclick=()=>{toggle(s.instruments,b.dataset.ear);again()});
  el.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{s.earChecked=true;again()});
  el.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{s.quiz[+b.dataset.q]=+b.dataset.o;again()});
  el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{s.rating=+b.dataset.r;again()});
  const ta=el.querySelector("textarea");let tt;
  if(ta)ta.oninput=()=>{s.note=ta.value;save();const m=el.querySelector("[data-saved]");m.textContent=t("saved");clearTimeout(tt);tt=setTimeout(()=>m.textContent="",1400)};
  el.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ta.value=(ta.value?ta.value+" ":"")+b.dataset.st+" ";ta.dispatchEvent(new Event("input"));ta.focus()});
  el.querySelectorAll("[data-val]").forEach(b=>b.onclick=()=>{const i=+b.dataset.val;s.listens[i]=true;if(i===2)s.savedAt=new Date().toLocaleDateString(lang==="fr"?"fr-FR":"en-GB");delete openStep[id];toast(t("stepSaved"));again(true)});
}

function renderWeek(id,keepScroll){
  const w=weeks.find(x=>x.id===id); if(!w){show("home");return}
  const y=window.scrollY;
  const next=weeks.find(x=>x.n===w.n+1);
  $("week").innerHTML=`
   <section class="bleed">
     ${w.image?`<img class="bg" src="${esc(w.image.path)}" alt="" style="object-position:${esc(w.image.focus||"50% 40%")}">`:""}
     <div class="inner"><div class="kicker">${t("week")} ${w.n} · ${esc(L(parcours.periods[w.period]))}</div><h2>${esc(L(w.title))}</h2>
       <div class="weekbar"><div class="bar"><i style="width:${stepsOf(w)/(w.works.length*3)*100}%"></i></div><span>${stepsOf(w)} / ${w.works.length*3} ${t("steps")}</span></div></div>
     <div class="credit">${credit(w.image)}</div>
   </section>
   <div class="paper"><div class="wrap">
     <a class="back" href="#">${t("back")}</a>
     ${w.world?`<p class="world"><span class="lab">${t("world")}</span>${esc(L(w.world))}</p>`:""}
     ${w.works.map(workHTML).join("")}
     ${w.review?`<div class="review">${esc(L(w.review))}</div>`:""}
     ${next?`<a class="cta next" href="#${next.id}">${t("nextWeek")}</a>`:""}
   </div></div>`;
  document.querySelectorAll("#week .work").forEach(bindWork);
  document.querySelectorAll("#week .track").forEach(el=>{
    bindTrack(el);
    if(playing&&playing.el.dataset.url===el.dataset.url&&playing.work===el.dataset.work){playing.el=el;setBtn(!audio.paused)}
  });
  show("week"); window.scrollTo(0,keepScroll?y:0);
}

(async()=>{
  const D=window.MAESTRO_DATA; // inlined copy for previews; the site itself reads the JSON files
  const get=p=>D?Promise.resolve(D[p]):fetch(p,{cache:"no-cache"}).then(r=>r.json());
  const [pc,idx,jr]=await Promise.all([get("_parcours.json"),get("_index.json"),get("journal/_journal.json").catch(()=>({entries:[]}))]);
  parcours=pc;journal=jr;
  weeks=await Promise.all(idx.weeks.map(w=>get(`semaines/${w.id}.json`)));
  route();
})();
</script>
